<!doctype html>
<!--
  Loaded in a hidden frame by the app (PaymentButtons.printReceipt) on iPad / iPhone: Safari
  blocks a page that prints on its own after a wait, but lets a frame start the print, and then
  prints the whole page, which on paper shows only the bill.
-->
<meta charset="utf-8" />
<title>Print</title>
<script>
  window.addEventListener('load', function () {
    window.print();
  });
</script>
